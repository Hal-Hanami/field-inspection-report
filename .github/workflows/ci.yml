name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The leak and design gates read tracked files, so the job needs the
          # repository rather than a shallow snapshot of one commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: inspection
          POSTGRES_PASSWORD: inspection
          POSTGRES_DB: inspection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inspection"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    defaults:
      run:
        working-directory: api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://inspection:inspection@localhost:5432/inspection_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      # Includes the shared validation cases (DESIGN 7.3), the migrations run from empty
      # (7.11), and the committed OpenAPI document and web types (7.4).
      - run: uv run pytest

  deploy:
    # Nothing reaches the public site that has not passed the gates above. The job is
    # skipped while the repository is private, where Pages is not served anyway, and for
    # pull requests. A manual run deploys too: a re-run of an old push still carries the
    # visibility the repository had at the time of that push.
    needs: [verify, api]
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
