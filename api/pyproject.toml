[project]
name = "field-inspection-api"
version = "0.1.0"
description = "HTTP API and PostgreSQL store for field inspection reports."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.118",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0.43",
    "uvicorn[standard]>=0.37",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pyright>=1.1.405",
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
# FastAPI injects dependencies as parameters; an endpoint's signature is its wiring.
"app/http/routes.py" = ["PLR0913", "PLR0917"]

[tool.pyright]
include = ["app", "tests", "migrations"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
