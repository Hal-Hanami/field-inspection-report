# Local PostgreSQL for the API and its tests. The host port is not the default one, so it
# does not collide with a PostgreSQL already running on the machine.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: inspection
      POSTGRES_PASSWORD: inspection
      POSTGRES_DB: inspection
    ports:
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./api/dev/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspection"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  db-data:
